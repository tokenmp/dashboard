# TokenMP Dashboard 部署（预览栈 next.tokenmp.cn）—— 推 v* 标签时, GitHub 托管 runner
# 通过 SSH 连到 tokenmp 生产服务器, 在 /opt/tokenmp-dashboard 本地 build + 重建预览容器
# + 写回 versions-next.env。正式栈(api.tokenmp.cn, 18180)不受影响；
# 把预览栈已验证版本发布到正式栈由 executor 仓库 prod-v* 标签的 promote.yml 负责。
# 不使用 self-hosted runner, 无需在服务器常驻 runner 进程。
#
# 所需 GitHub Secrets (见 docs/deployment.md):
#   DEPLOY_HOST     生产服务器地址
#   DEPLOY_USER     部署账号(sumwai, 在 docker 组、有 NOPASSWD sudo)
#   DEPLOY_SSH_KEY  部署账号的 SSH 私钥
name: deploy

on:
  push:
    tags: ['v*']

concurrency:
  group: deploy-dashboard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ github.ref_name }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: TAG
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/tokenmp-dashboard
            git fetch --tags --force origin
            git checkout "$TAG"
            docker build -t tokenmp-dashboard:"$TAG" -t tokenmp-dashboard:latest .
            sed -i "s/^DASHBOARD_VERSION=.*/DASHBOARD_VERSION=$TAG/" /opt/tokenmp/versions-next.env
            docker compose --env-file /opt/tokenmp/versions-next.env \
              -f docker-compose.next.yml up -d --no-deps --no-build --force-recreate
            sleep 5
            # 冒烟：首页(SPA) + 公开 API（预览栈固定 18280）
            curl -fsS "http://127.0.0.1:18280/" >/dev/null
            curl -fsS "http://127.0.0.1:18280/api/v1/site/overview" >/dev/null
            echo "✓ dashboard $TAG deployed (预览栈 next.tokenmp.cn)"
