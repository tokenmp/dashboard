# TokenMP Dashboard —— FrankenPHP（Caddy + PHP）单容器
#
# 一键起：  docker compose up --build
# 访问：    http://localhost:${PORT:-8080}
#
# 配置通过环境变量注入（ThinkPHP 的 env() 读取 $_ENV）。
services:
  app:
    build: .
    image: tokenmp-dashboard:latest
    container_name: tokenmp-dashboard
    ports:
      - "${PORT:-8080}:80"
    environment:
      # ⚠️ 生产务必改为强随机值！可通过宿主机环境变量覆盖：
      #   export JWT_SECRET=$(openssl rand -hex 32)
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-random-string}
      JWT_EXPIRE: "604800"
      JWT_PREFIX: Bearer
      APP_DEBUG: "false"
      # 密钥哈希 pepper（须与 executor 一致，否则生成的密钥无法鉴权）：
      #   export API_KEY_PEPPER='<与生产 executor 相同的 pepper>'
      API_KEY_PEPPER: ${API_KEY_PEPPER:-}
      # 上游账号加密主密钥（须与 executor 一致，否则创建/探测账号报未配置）：
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
      # 接入数据库时按需补充（镜像已装 pdo_mysql / pdo_pgsql / pgsql 扩展）：
      # DB_TYPE: mysql
      # DB_HOST: db
      # DB_NAME: tokenmp
      # DB_USER: root
      # DB_PASS: secret
      # DB_PORT: "3306"
    restart: unless-stopped
