# ============================================================
# TokenMP Dashboard —— 生产编排（tokenmp 服务器 / 蓝绿「绿栈」）
# 来源: github.com/tokenmp/dashboard
# 运行时: FrankenPHP(Caddy+PHP 8.4),容器内 80（/api/v1 与 SPA 同端口）
# 数据库: 同机 postgres 容器（postgres-redis_default 网络内主机名 postgres）的 tokenmp 库
# 端口:   仅绑 127.0.0.1:18080 —— 只供同机 host 级 Caddy 反代
#         （8080/3000 被蓝栈 systemd 旧 management + 旧 next web 占用，切流前不可动）
# ============================================================
#
# 密钥与版本(单一来源, 详见 docs/deployment.md):
#   - env_file: /opt/tokenmp/secrets.env   注入容器内密钥
#     (JWT_SECRET / API_KEY_PEPPER / MASTER_ENCRYPTION_KEY / PG_PASS 等)
#     ⚠️ API_KEY_PEPPER / MASTER_ENCRYPTION_KEY 必须与 executor 容器一致,
#        两边都只来自这一份文件 —— 用 scripts/gen-secrets.sh 生成。
#   - image tag: tokenmp-dashboard:${DASHBOARD_VERSION}
#     版本号由 `docker compose --env-file /opt/tokenmp/versions.env` 插值提供。
#
# 日常部署: 打 v* git 标签 → GitHub 托管 runner SSH 进服务器
#           build + 重建 + 写回 versions.env + 首页冒烟。
# 切流:     executor 仓库打 prod-v* 标签触发 promote.yml。
# ============================================================
services:
  tokenmp-dashboard:
    image: tokenmp-dashboard:${DASHBOARD_VERSION:-latest}
    container_name: tokenmp-dashboard
    restart: always
    networks:
      - pgnet
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-18080}:80"
    # 共享密钥 (JWT_SECRET / API_KEY_PEPPER / MASTER_ENCRYPTION_KEY / PG_PASS 等)
    # 统一来自宿主机 /opt/tokenmp/secrets.env —— 单一来源, 与 executor 容器保持一致。
    env_file:
      - /opt/tokenmp/secrets.env
    environment:
      JWT_EXPIRE: "604800"
      JWT_PREFIX: "Bearer"
      APP_DEBUG: "false"
      PG_HOST: "${PG_HOST:-postgres}"
      PG_PORT: "${PG_PORT:-5432}"
      PG_DB: "${PG_DB:-tokenmp}"
      PG_USER: "${PG_USER:-tokenmp}"
      PG_CHARSET: "utf8"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://localhost/ || wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./data:/app/runtime
    labels:
      createdBy: "Apps"
networks:
  pgnet:
    # postgres + redis 容器所在的既有网络；dashboard 经容器网直连 PG
    name: postgres-redis_default
    external: true
